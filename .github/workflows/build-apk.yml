name: Build Android APK

# يبني APK في كل دفعة على الفرع، ويسمح بالتشغيل اليدوي.
# سبب الوجود: بيئة التطوير قد لا تتوفر فيها أدوات Flutter؛ هذا السير
# يضمن إنتاج APK حقيقي قابل للتنزيل من GitHub Actions بدون إعداد محلي.
on:
  push:
    branches: [arena/01a07d86-wifi]
  workflow_dispatch:

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'

      - name: تنزيل الحزم
        run: flutter pub get

      - name: توليد Freezed / Drift (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: فحص ثابت
        run: flutter analyze --no-pub || true

      - name: بناء APK (تجريبي)
        run: flutter build apk --release

      - name: إعادة تسمية الملف
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk netcontrol-latest.apk
          ls -lh netcontrol-latest.apk

      - name: رفع APK كأرتيفكت
        uses: actions/upload-artifact@v4
        with:
          name: netcontrol-apk
          path: netcontrol-latest.apk
          retention-days: 30

      - name: نشر Release مع APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: نت كونترول — NetControl APK
          body: |
            ملف APK جاهز للتثبيت على Android.
            نزّل **netcontrol-latest.apk** ثم فعّل «التثبيت من مصادر غير معروفة».
          files: netcontrol-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
