name: Build Android APK

on:
  push:
    branches: [arena/01a07d86-wifi]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: إصدارات الأدوات
        run: |
          flutter --version
          dart --version

      - name: تنزيل الحزم (pub get)
        id: pub
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub_get.log || true
          if grep -qiE "Got dependencies|Resolving dependencies done" pub_get.log && [ "${PIPESTATUS[0]}" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: إنشاء Issue بالخطأ إن فشل pub get
        if: steps.pub.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## فشل flutter pub get"
            echo ""
            echo "الفرع: ${GITHUB_REF}  الالتزام: ${GITHUB_SHA::7}"
            echo ""
            echo '```'
            tail -n 80 pub_get.log
            echo '```'
          } > issue_body.md
          gh issue create --title "❗ خطأ بناء: flutter pub get" --body-file issue_body.md || true
          echo "===== سجل pub get (للعرض في اللوغ) ====="
          cat pub_get.log
          exit 1

      - name: توليد Freezed / Drift (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: بناء APK (تجريبي)
        run: flutter build apk --release

      - name: إعادة تسمية الملف
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk netcontrol-latest.apk
          ls -lh netcontrol-latest.apk

      - name: رفع APK كأرتيفكت
        uses: actions/upload-artifact@v4
        with:
          name: netcontrol-apk
          path: netcontrol-latest.apk
          retention-days: 30

      - name: نشر Release مع APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: نت كونترول — NetControl APK
          body: |
            ملف APK جاهز للتثبيت على Android.
            نزّل netcontrol-latest.apk ثم فعّل «التثبيت من مصادر غير معروفة».
          files: netcontrol-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
