name: netcontrol
description: نت كونترول - تطبيق شامل للتحكم بالشبكة والأمان (Android / iOS)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ── إدارة الحالة ──────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── قاعدة البيانات (Drift / SQLCipher) ────────────────────────
  drift: ^2.16.0
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── الشبكات ───────────────────────────────────────────────────
  dio: ^5.4.1
  dart_ping: ^9.0.1
  dart_ping_ios: ^4.0.2
  multicast_dns: ^0.3.2+6
  bonsoir: ^5.1.0
  upnp: ^2.0.2
  network_info_plus: ^5.0.3
  connectivity_plus: ^6.0.3

  # ── الرسوم البيانية والخرائط ─────────────────────────────────
  fl_chart: ^0.67.0
  syncfusion_flutter_charts: ^24.2.9
  syncfusion_flutter_maps: ^24.2.9
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # ── الموقع والبلوتوث ─────────────────────────────────────────
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_blue_plus: ^1.31.16
  flutter_reactive_ble: ^5.3.1

  # ── التخزين والتصدير ─────────────────────────────────────────
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  pdf: ^3.10.7
  printing: ^5.12.0
  csv: ^5.1.1
  archive: ^3.4.10
  share_plus: ^7.2.2

  # ── الخدمات الخلفية والإشعارات ───────────────────────────────
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.5.2
  background_fetch: ^1.3.0
  flutter_foreground_task: ^8.2.0

  # ── الأمان والتشفير ──────────────────────────────────────────
  cryptography: ^2.7.0
  encrypt: ^5.0.3
  pointycastle: ^3.7.4
  local_auth: ^2.2.0

  # ── أدوات مساعدة ─────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.2.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  collection: ^1.18.0
  rxdart: ^0.27.7

  # ── معلومات الجهاز والصلاحيات ────────────────────────────────
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  permission_handler: ^11.2.0

  # ── واجهة المستخدم ──────────────────────────────────────────
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

  # ── توليد الكود ──────────────────────────────────────────────
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.7.1
  riverpod_lint: ^2.3.4
  custom_lint: ^0.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/data/
